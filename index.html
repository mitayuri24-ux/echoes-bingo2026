  {id:"tanisensei",  label:"谷本先生と話す",     match:["谷本先生"]},
  // --- 分野・キーワード系（QR対応）---
  {id:"ocean",     label:"海洋物理の人に会う",          match:["海洋物理"]},
  {id:"airsea",    label:"大気海洋相互作用の人に会う",  match:["大気海洋相互作用"]},
  {id:"meso",      label:"メソ気象の人に会う",          match:["メソ気象"]},
  {id:"kansoku",   label:"観測の人に会う",              match:["観測"]},
  {id:"kuroshio",  label:"黒潮の人に会う",              match:["黒潮"]},
  {id:"typhoon",   label:"台風の人に会う",              match:["台風"]},
  {id:"precip",    label:"降水の人に会う",              match:["降水"]},
  {id:"yamase",    label:"やませの話を聞く",            match:["やませ"]},
];

// ============ STATE ============
let currentUser = null;
let cardSquares = [];
let openCells = new Set();
let scanner = null;
let pendingCellIndex = null;
let bingoAlreadyCelebrated = false;

// ============ SEEDED RANDOM ============
function seededRandom(seed) {
  let s = seed;
  return function() {
    s = (s * 1103515245 + 12345) & 0x7fffffff;
    return s / 0x7fffffff;
  };
}
function shuffleArray(arr, rng) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function generateCard(userId) {
  var rng = seededRandom(userId * 7919 + 42);
  // Filter out squares where the current user is the ONLY matching person
  var eligible = allSquares.filter(function(sq) {
    if (sq.match.length === 0) return true; // manual-only: always OK
    // Find all participants who have any of the square's match tags
    var others = participants.filter(function(p) {
      if (p.id === userId) return false; // exclude self
      return sq.match.some(function(m) { return p.tags.indexOf(m) >= 0; });
    });
    return others.length > 0; // keep only if someone ELSE matches
  });
  var shuffled = shuffleArray(eligible, rng);
  var selected = shuffled.slice(0, 24);
  var card = [];
  for (var i = 0; i < 25; i++) {
    if (i === 12) {
      card.push({ id: "free", label: "FREE", match: [] });
    } else {
      card.push(selected[i < 12 ? i : i - 1]);
    }
  }
  return card;
}

function checkBingo() {
  const lines = [];
  for (let r = 0; r < 5; r++) lines.push([0,1,2,3,4].map(c => r*5+c));
  for (let c = 0; c < 5; c++) lines.push([0,1,2,3,4].map(r => r*5+c));
  lines.push([0,6,12,18,24]);
  lines.push([4,8,12,16,20]);
  for (const line of lines) {
    if (line.every(i => openCells.has(i) || i === 12)) return true;
  }
  return false;
}

// ============ CONFETTI ============
function launchConfetti() {
  const colors = ['#f39c12','#e74c3c','#2ecc71','#3498db','#9b59b6','#1abc9c','#e67e22','#e91e63'];
  for (let i = 0; i < 80; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.width = (Math.random() * 8 + 6) + 'px';
    el.style.height = (Math.random() * 8 + 6) + 'px';
    el.style.animationDuration = (Math.random() * 2 + 2) + 's';
    el.style.animationDelay = (Math.random() * 1.5) + 's';
    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    document.body.appendChild(el);
    setTimeout(function(){ el.remove(); }, 5000);
  }
}
function showCelebration() {
  if (bingoAlreadyCelebrated) return;
  bingoAlreadyCelebrated = true;
  launchConfetti();
  document.getElementById('celebrate-overlay').classList.add('active');
}
function closeCelebration() {
  document.getElementById('celebrate-overlay').classList.remove('active');
}

// ============ UI ============
function startBingo() {
  var id = parseInt(document.getElementById('input-id').value);
  if (!id || id < 1 || id > 49) { alert('1〜49の番号を入力してください'); return; }
  currentUser = participants.find(function(p){ return p.id === id; });
  if (!currentUser) { alert('番号が見つかりません'); return; }

  var saved = localStorage.getItem('echoes_bingo_' + id);
  if (saved) { openCells = new Set(JSON.parse(saved)); }
  var celebSaved = localStorage.getItem('echoes_bingo_celeb_' + id);
  if (celebSaved) { bingoAlreadyCelebrated = true; }

  cardSquares = generateCard(id);

  document.getElementById('page-landing').classList.add('hidden');
  document.getElementById('page-main').classList.remove('hidden');
  document.getElementById('user-label').textContent =
    currentUser.name + '\uFF08' + currentUser.aff + '\uFF09';

  if (!currentUser.senior) {
    document.getElementById('tab-qr').classList.add('hidden');
  }
  renderGrid();
  showTab('bingo');
}

function renderGrid() {
  var grid = document.getElementById('bingo-grid');
  grid.innerHTML = '';
  cardSquares.forEach(function(sq, i) {
    var cell = document.createElement('div');
    cell.className = 'cell';
    if (sq.id === 'free') {
      cell.classList.add('free', 'open');
      cell.textContent = '\u2605 FREE';
    } else {
      cell.textContent = sq.label;
      if (openCells.has(i)) {
        cell.classList.add('open');
      } else {
        cell.addEventListener('click', function(){ onCellTap(i); });
      }
    }
    grid.appendChild(cell);
  });
  var opened = openCells.size;
  document.getElementById('progress').textContent = opened + ' / 24 マス';

  if (checkBingo()) {
    showCelebration();
    localStorage.setItem('echoes_bingo_celeb_' + currentUser.id, '1');
  }
}

// Manual tap
function onCellTap(index) {
  pendingCellIndex = index;
  document.getElementById('confirm-label').textContent =
    '\u300C' + cardSquares[index].label + '\u300D';
  document.getElementById('confirm-overlay').classList.add('active');
}
function confirmCell(yes) {
  document.getElementById('confirm-overlay').classList.remove('active');
  if (yes && pendingCellIndex !== null) {
    openCells.add(pendingCellIndex);
    saveState();
    renderGrid();
  }
  pendingCellIndex = null;
}

function saveState() {
  localStorage.setItem('echoes_bingo_' + currentUser.id,
    JSON.stringify(Array.from(openCells)));
}

function showTab(tab) {
  var tabs = document.querySelectorAll('.tab');
  tabs.forEach(function(t){ t.classList.remove('active'); });
  if (tab === 'bingo') {
    document.getElementById('tab-bingo').classList.remove('hidden');
    document.getElementById('tab-myqr').classList.add('hidden');
    tabs[0].classList.add('active');
  } else {
    document.getElementById('tab-bingo').classList.add('hidden');
    document.getElementById('tab-myqr').classList.remove('hidden');
    tabs[1].classList.add('active');
    renderQR();
  }
}

function renderQR() {
  if (!currentUser || !currentUser.senior) return;
  document.getElementById('qr-name').textContent = currentUser.name;
  document.getElementById('qr-affil').textContent =
    currentUser.aff + '\u30FB' + currentUser.grade;
  var canvas = document.getElementById('qr-canvas');
  if (canvas.children.length === 0) {
    new QRCode(canvas, {
      text: 'ECHOES2026:' + currentUser.id,
      width: 200, height: 200,
      colorDark: '#1a5276', colorLight: '#ffffff'
    });
  }
}

// ============ SCANNER ============
function openScanner() {
  var overlay = document.getElementById('scanner-overlay');
  overlay.classList.add('active');
  document.getElementById('scanner-msg').textContent =
    'QRコードをカメラに映してください';
  scanner = new Html5Qrcode('scanner-box');
  scanner.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: { width: 250, height: 250 } },
    onScanSuccess, function(){}
  ).catch(function(err) {
    document.getElementById('scanner-msg').textContent =
      'カメラを起動できませんでした';
  });
}

function onScanSuccess(decoded) {
  if (!decoded.startsWith('ECHOES2026:')) {
    document.getElementById('scanner-msg').textContent = '無効なQRコードです';
    return;
  }
  var scannedId = parseInt(decoded.split(':')[1]);
  var scanned = participants.find(function(p){ return p.id === scannedId; });
  if (!scanned) {
    document.getElementById('scanner-msg').textContent = '不明な参加者です';
    return;
  }
  var matched = false;
  var matchedLabels = [];
  cardSquares.forEach(function(sq, i) {
    if (sq.id === 'free' || openCells.has(i)) return;
    var hasMatch = sq.match.some(function(m){ return scanned.tags.indexOf(m) >= 0; });
    if (hasMatch) {
      openCells.add(i);
      matched = true;
      matchedLabels.push(sq.label);
    }
  });
  saveState();
  if (matched) {
    document.getElementById('scanner-msg').textContent =
      '\u2705 ' + scanned.name + 'さん！ → ' + matchedLabels.join('、');
  } else {
    document.getElementById('scanner-msg').textContent =
      scanned.name + 'さん（新しく開くマスはありませんでした）';
  }
  setTimeout(function(){ closeScanner(); renderGrid(); }, 2000);
}

function closeScanner() {
  var overlay = document.getElementById('scanner-overlay');
  overlay.classList.remove('active');
  if (scanner) { scanner.stop().catch(function(){}); scanner = null; }
}
// ============ NAME LIST ============
function buildNameList() {
  var list = document.getElementById('name-list');
  if (!list) return;
  var groups = [];
  var groupMap = {};
  participants.forEach(function(p) {
    if (!groupMap[p.aff]) {
      groupMap[p.aff] = [];
      groups.push({ aff: p.aff, members: groupMap[p.aff] });
    }
    groupMap[p.aff].push(p);
  });
  groups.forEach(function(g) {
    var label = document.createElement('div');
    label.className = 'name-group-label';
    label.textContent = g.aff;
    list.appendChild(label);
    g.members.forEach(function(p) {
      var btn = document.createElement('button');
      btn.className = 'name-btn';
      btn.innerHTML = '<span class="num">' + p.id + '</span>' + p.name;
      btn.addEventListener('click', function() {
        document.getElementById('input-id').value = p.id;
        startBingo();
      });
      list.appendChild(btn);
    });
  });
}
buildNameList();
// URL param
var urlParams = new URLSearchParams(window.location.search);
var paramId = urlParams.get('id');
if (paramId) {
  document.getElementById('input-id').value = paramId;
  window.addEventListener('DOMContentLoaded', function(){ startBingo(); });
  startBingo();
}
</script>
